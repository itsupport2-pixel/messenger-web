async function _fetchReportJobs(from,to){
  var r=await api("getJobs",{});
  if(!r.ok) return {ok:false,error:r.error};
  var jobs=r.data.filter(function(j){ return j.ymd>=from && j.ymd<=to; });
  jobs.sort(function(a,b){ return b.ymd.localeCompare(a.ymd) || b.rowNum-a.rowNum; });
  return {ok:true, jobs:jobs};
}

function _buildReportRows(jobs){
  var today=fmtYMDClient(new Date());
  var doneC=0,pendC=0,cancC=0,newC=0;
  var rows=jobs.map(function(j){
    var days="-";
    if(j.status==="pending"){
      var d1=new Date(j.ymd+"T00:00:00"), d2=new Date(today+"T00:00:00");
      var diff=Math.round((d2-d1)/86400000);
      days=diff>0?(diff+" วัน"):(diff===0?"วันนี้":"-");
    }
    var cancelReason="-";
    if(j.status==="cancelled"){
      var mm=(j.assign||"").match(/เหตุผล:\s*(.+)$/);
      cancelReason=mm?mm[1].trim():"-";
    }
    var timing="-";
    if(j.status==="done"){
      var mSent=(j.sent||"").match(/เสร็จสิ้น\s+(\d{2})\/(\d{2})\/(\d{4})/);
      if(mSent){
        var doneDate=new Date(parseInt(mSent[3],10),parseInt(mSent[2],10)-1,parseInt(mSent[1],10));
        var schedDate=new Date(j.ymd+"T00:00:00");
        var diffDays=Math.round((doneDate-schedDate)/86400000);
        timing=diffDays>0?("ช้า "+diffDays+" วัน"):"ตรงเวลา";
      }
    }
    if(j.status==="done")doneC++; else if(j.status==="pending")pendC++; else if(j.status==="cancelled")cancC++; else newC++;
    var statusLabel=j.status==="done"?"เสร็จแล้ว":j.status==="cancelled"?"ยกเลิก":j.status==="pending"?"ค้างอยู่":"ใหม่";
    return {j:j, days:days, cancelReason:cancelReason, timing:timing, statusLabel:statusLabel};
  });
  return {rows:rows, totalC:jobs.length, doneC:doneC, pendC:pendC, cancC:cancC, newC:newC};
}

async function runPrintReport(btn){
  var from=document.getElementById("prFrom").value;
  var to=document.getElementById("prTo").value;
  if(!from||!to){alert("กรุณาเลือกช่วงวันที่");return;}
  btn.disabled=true; var oldLabel=btn.textContent; btn.textContent="กำลังโหลด...";
  var f=await _fetchReportJobs(from,to);
  if(!f.ok){btn.disabled=false;btn.textContent=oldLabel;alert("โหลดข้อมูลไม่สำเร็จ: "+(f.error||""));return;}
  var rep=_buildReportRows(f.jobs);
  var rowsHtml=rep.rows.map(function(x){
    var j=x.j;
    return "<tr style=\""+(j.status==="pending"?"background:#FFF7ED":"")+"\"><td>"+escapeHtml(j.jobNo)+"</td><td>"+escapeHtml(j.date)+"</td><td>"+escapeHtml(j.company)+"</td><td>"+escapeHtml(j.place||"-")+"</td><td>"+escapeHtml(j.dept||"-")+"</td><td>"+x.statusLabel+(j.urgent?' <b style="color:#DC2626">(ด่วน)</b>':"")+"</td><td style=\"text-align:center;font-weight:700;"+(x.days!=="-"&&x.days!=="วันนี้"?"color:#DC2626":"")+"\">"+x.days+"</td><td style=\"text-align:center;"+(x.timing.indexOf("ช้า")===0?"color:#DC2626;font-weight:700":"")+"\">"+escapeHtml(x.timing)+"</td><td>"+escapeHtml(x.cancelReason)+"</td></tr>";
  }).join("");
  document.getElementById("printReportArea").innerHTML=
    '<div class="print-header"><h1>รายงานสรุปงานทั้งหมด — Messenger System</h1>'+
    '<div class="print-meta">ช่วงวันที่ '+from+' ถึง '+to+' &nbsp;·&nbsp; พิมพ์เมื่อ '+new Date().toLocaleString("th-TH")+'</div>'+
    '<div class="print-summary"><span>ทั้งหมด <b>'+rep.totalC+'</b></span><span>เสร็จแล้ว <b>'+rep.doneC+'</b></span><span style="color:#B45309">ค้างอยู่ <b>'+rep.pendC+'</b></span><span>ยกเลิก <b>'+rep.cancC+'</b></span></div></div>'+
    '<table class="print-table"><thead><tr><th>เลขงาน</th><th>วันที่นัด</th><th>บริษัท/ลูกค้า</th><th>สถานที่</th><th>แผนก</th><th>สถานะ</th><th>ค้างมา</th><th>ผลส่งงาน</th><th>เหตุผลยกเลิก</th></tr></thead><tbody>'+
    (rowsHtml||'<tr><td colspan="9" style="text-align:center;padding:20px;color:#94A3B8">ไม่พบงานในช่วงวันที่นี้</td></tr>')+
    '</tbody></table>';
  btn.disabled=false; btn.textContent=oldLabel;
  closeModal();
  setTimeout(function(){ window.print(); }, 200);
}

async function runExportExcel(btn){
  var from=document.getElementById("prFrom").value;
  var to=document.getElementById("prTo").value;
  if(!from||!to){alert("กรุณาเลือกช่วงวันที่");return;}

  if(!f.ok){btn.disabled=false;btn.textContent=oldLabel;alert("โหลดข้อมูลไม่สำเร็จ: "+(f.error||""));return;}
  var rep=_buildReportRows(f.jobs);
  var rowsHtml=rep.rows.map(function(x){
    var j=x.j;
    return "<tr><td>"+escapeHtml(j.jobNo)+"</td><td>"+escapeHtml(j.date)+"</td><td>"+escapeHtml(j.company)+"</td><td>"+escapeHtml(j.place||"-")+"</td><td>"+escapeHtml(j.dept||"-")+"</td><td>"+x.statusLabel+(j.urgent?" (ด่วน)":"")+"</td><td>"+x.days+"</td><td>"+escapeHtml(x.timing)+"</td><td>"+escapeHtml(x.cancelReason)+"</td></tr>";
  }).join("");
  var html='<html><head><meta charset="UTF-8"></head><body><table border="1"><thead><tr><th>เลขงาน</th><th>วันที่นัด</th><th>บริษัท/ลูกค้า</th><th>สถานที่</th><th>แผนก</th><th>สถานะ</th><th>ค้างมา</th><th>ผลส่งงาน</th><th>เหตุผลยกเลิก</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></body></html>';
  var blob=new Blob(["\ufeff"+html], {type:"application/vnd.ms-excel;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="รายงานงานทั้งหมด_"+from+"_ถึง_"+to+".xls";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  btn.disabled=false; btn.textContent=oldLabel;
  closeModal();
}

function monthOptions(){
  const out=[],now=new Date();
  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const lbl=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()]+' '+d.getFullYear();
    out.push(`<option value="${v}" ${i===0?'selected':''}>${lbl}</option>`);
  }
  return out.join('');
}
function listSetStatus(btn, val){
  document.querySelectorAll('.list-status-pill').forEach(function(b){
    b.classList.remove('active');
  });

  var sf = document.getElementById('statusFilter');
  if(sf){ sf.value = val; }
  loadList();
}

async function confirmMarkDone(rowNum, sheetName, jobNo, user) {
  const btn    = document.getElementById('markDoneBtn');
  const status = document.getElementById('markDoneStatus');
  if(!btn) return;

  btn.disabled = true;
  btn.textContent = 'Getting GPS location...';
  if(status) status.textContent = 'Waiting for GPS...';

  var lat = '', lng = '';

  // Try to get GPS
  try {
    const pos = await new Promise(function(resolve, reject){
      if(!navigator.geolocation){ reject(new Error('no_geo')); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true, timeout: 8000, maximumAge: 0
      });
    });
    lat = pos.coords.latitude.toFixed(6);
    lng = pos.coords.longitude.toFixed(6);
    if(status) status.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>พิกัด: '+lat+', '+lng;
  } catch(geoErr) {
    // GPS ไม่ได้ก็บันทึกได้ แต่ไม่มีพิกัด
    if(status) status.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>ไม่ได้รับพิกัด GPS — จะบันทึกสถานะโดยไม่มีพิกัด';
  }

  btn.textContent = 'Saving...';

  const r = await api('markDone', {
    row:       rowNum,
    sheetName: sheetName,
    jobNo:     jobNo,
    user:      user,
    lat:       lat,
    lng:       lng
  });

  if(r.ok){
    btn.textContent = 'Completed';
    btn.style.background = 'var(--success)';
    if(status){
      status.innerHTML = '<span style="color:var(--success);font-weight:700">บันทึกเมื่อ '+r.data.doneAt+'</span>'
        +(r.data.gps?'<br><span style="color:#2563EB;display:inline-flex;align-items:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>GPS: '+escapeHtml(r.data.gps)+'</span>':'');
    }
    cacheClearAll();   // clear cache ให้ reload ข้อมูลใหม่
  } else {
    btn.disabled = false;
    btn.textContent = 'Mark Complete + Save GPS';
    if(status) status.textContent = 'Error: ' + (r.error||'Unknown error');
  }
}

async function loadDashboardData(s,e){
  s=s||drpState.s; e=e||drpState.e;
  const r=await apiCached('getJobs',{},45000);
  if(!r.ok)return;
  let jobs=r.data;
  if(s&&e)jobs=jobs.filter(j=>j.ymd>=s&&j.ymd<=e);
  const total=jobs.length,done=jobs.filter(j=>j.status==='done').length,
    pending=jobs.filter(j=>j.status==='pending').length,urgent=jobs.filter(j=>!!j.urgent).length;
  const compRate=total?Math.round(done/total*100):0;
  let totalMins=0,durCount=0;
  jobs.forEach(j=>{
    if(!j.time)return;
    const pts=j.time.split('-');
    if(pts.length===2){
      const [h1,m1]=(pts[0]||'').split(':').map(Number);
      const [h2,m2]=(pts[1]||'').split(':').map(Number);
      if(!isNaN(h1)&&!isNaN(h2)){const diff=(h2*60+m2)-(h1*60+m1);if(diff>0){totalMins+=diff;durCount++;}}

  // ── Cache cfg array for re-render, then draw Row 1 ──────────────

  // ── Row 2: top 4 job types as stat cards ────────────────────────

  // Dept bars
  var db=document.getElementById('deptBars');
  var dTotal=document.getElementById('deptTotal');
  if(db){
    var maxD=Math.max(1,Math.max.apply(null,Object.values(byDept)));

        '<span class="rank-name">'+escapeHtml(u)+'</span>'+
        '<div class="rank-bar-wrap"><div class="rank-bar" style="width:'+pct+'%"></div></div>'+

function _renderDashJobList(allJobs, s, e) {
  var bg = document.querySelector('.exec-page-bg');
  // Create panel once, reuse — avoids expensive DOM rebuild
  var panel = document.getElementById('dashJobList');
  if (!panel && bg) {
    panel = document.createElement('div');
    panel.id = 'dashJobList';
    bg.appendChild(panel);
  }
  if (!panel) return;

  if (!_dashFilter) {
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }

  var rs = s || drpState.s;
  var re = e || drpState.e;

  var filtered = allJobs.filter(function(j) {
    var inRange = (!rs||!re) || (j.ymd>=rs && j.ymd<=re);
    if (!inRange) return false;
    if (_dashFilter==='all')     return true;
    if (_dashFilter==='done')    return j.status==='done';
    if (_dashFilter==='pending') return j.status==='pending';
    if (_dashFilter==='urgent')  return !!j.urgent;
    return true;
  });

  var FILTER_LABEL = { all:'ทั้งหมด', done:'Completed', pending:'Pending', urgent:'Urgent' };
  var FILTER_EMOJI = {
    all:     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    done:    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    pending: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    urgent:  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
  };
  var FILTER_COLOR = { all:'#2563EB', done:'#059669', pending:'#D97706', urgent:'#DC2626' };
  var FILTER_BG    = { all:'#EFF6FF', done:'#ECFDF5', pending:'#FFFBEB', urgent:'#FEF2F2' };
  var fc = FILTER_COLOR[_dashFilter]||'#2563EB';
  var fb = FILTER_BG[_dashFilter]||'#EFF6FF';
  var fl = FILTER_LABEL[_dashFilter]||_dashFilter;
  var fe = FILTER_EMOJI[_dashFilter]||FILTER_EMOJI.all;

  var rows = filtered.length ? filtered.slice(0,50).map(function(j) {
    var stBadge = j.status==='done'
      ? '<span style="background:#ECFDF5;color:#059669;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> สำเร็จ</span>'
      : j.status==='pending'
      ? '<span style="background:#FFFBEB;color:#D97706;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> รอดำเนินการ</span>'
      : '<span style="background:#F1F5F9;color:#64748B;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ใหม่</span>';
    var urgBadge = j.urgent ? ' <span style="background:#FEF2F2;color:#DC2626;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ด่วน</span>' : '';
    var typeStr = (j.types||[]).join(', ');
    return '<tr style="border-bottom:1px solid #F8FAFC">'+
      '<td style="padding:11px 14px;font-size:11.5px;font-weight:700;color:#2563EB;white-space:nowrap;font-family:Inter,sans-serif">'+escapeHtml(j.jobNo)+'</td>'+
      '<td style="padding:11px 14px;font-size:12px;color:#475569;white-space:nowrap">'+escapeHtml(j.date)+'</td>'+
      '<td style="padding:11px 14px;font-size:12px;font-weight:600;color:#0F172A">'+escapeHtml(j.company)+'</td>'+
      '<td style="padding:11px 14px;font-size:12px;color:#475569">'+escapeHtml(j.place||'—')+'</td>'+
      '<td style="padding:11px 14px;font-size:11px;color:#64748B;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(typeStr||'—')+'</td>'+
      '<td style="padding:11px 14px;font-size:12px;white-space:nowrap">'+stBadge+urgBadge+'</td>'+
      '<td style="padding:11px 14px;font-size:12px;color:#64748B">'+escapeHtml(j.user)+'</td>'+
    '</tr>';
  }).join('') :
  '<tr><td colspan="7" style="padding:40px;text-align:center;color:#94A3B8;font-size:13px">— ไม่มีข้อมูลในช่วงที่เลือก —</td></tr>';

  var TH = function(t){ return '<th style="padding:9px 14px;text-align:left;font-size:9.5px;font-weight:700;color:#94A3B8;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:#FAFBFC">'+t+'</th>'; };

  panel.className = 'dash-job-panel';
  panel.style.display = 'block';
  panel.innerHTML =
    '<div class="dash-job-panel-head" style="border-left:4px solid '+fc+';background:linear-gradient(135deg,'+fb+',#fff)">'+
      '<div class="dash-job-panel-title" style="color:'+fc+'">'+
        '<span style="font-size:16px">'+fe+'</span>'+
        fl+' &nbsp;<span style="background:'+fc+';color:#fff;font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700">'+filtered.length+'</span>'+
      '</div>'+
      '<button class="dash-job-panel-close" onclick="dashClosePanel()">✕ ปิด</button>'+
    '</div>'+
    '<div style="overflow-x:auto">'+
      '<table style="width:100%;border-collapse:collapse">'+
        '<thead><tr>'+TH('เลขงาน')+TH('วันที่')+TH('บริษัท')+TH('สถานที่')+TH('ประเภทงาน')+TH('สถานะ')+TH('ผู้บันทึก')+'</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
      (filtered.length>50?'<div style="text-align:center;padding:12px;font-size:11px;color:#94A3B8;border-top:1px solid #F1F5F9">แสดง 50 รายการแรก จากทั้งหมด '+filtered.length+' รายการ</div>':'')+
    '</div>';
}

function dashClosePanel(){
  _dashFilter='';
  var p=document.getElementById('dashJobList');
  if(p){ p.style.display='none'; p.innerHTML=''; }
  _refreshDashCards();
}

function previewLogoFile(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=function(e){
    const origUrl=e.target.result;
    const img=new Image();
    img.onload=function(){
      const maxSize=120;
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const resized=canvas.toDataURL('image/jpeg',0.85);
      const box=document.getElementById('logoPreviewBox');
      if(box)box.innerHTML='<img src="'+resized+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px">';
      const inp=document.getElementById('setLogo');
      if(inp)inp.value=resized;
      applyTheme(Object.assign({},State.settings,{logoUrl:resized}));
    };
    img.src=origUrl;
  };
  reader.readAsDataURL(file);
}

async function doExport(format){
  const s=drpState.s, e=drpState.e;
  const r=await api('exportData',{token:State.adminToken,month:''});
  if(!r.ok)return toast(r.error,'error');
  let jobs=r.data;
  if(s&&e)jobs=jobs.filter(j=>j.ymd>=s&&j.ymd<=e);
  const headers=['เลขงาน','วันที่','เวลา','บริษัท','สถานที่','โลเคชั่น','เบอร์','รายละเอียด','ประเภทงาน','แผนก','ผู้บันทึก','เร่งด่วน','สถานะ'];
  const rows=jobs.map(j=>[j.jobNo,j.date,j.time,j.company,j.place,j.location,j.phone,j.detail,j.types.join('|'),j.dept,j.user,j.urgent,j.sent]);
  if(format==='csv'){
    const csv=[headers,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadFile('messenger_export.csv','\ufeff'+csv,'text/csv;charset=utf-8');
  } else {
    const html=`<table><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c||'')}</td>`).join('')}</tr>`).join('')}</table>`;
    downloadFile('messenger_export.xls',html,'application/vnd.ms-excel');
  }
  toast('Exported '+jobs.length+' records');
}
function downloadFile(filename,content,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);}

(function(){
  for(let h=6;h<=21;h++){

      const t=String(h).padStart(2,'0')+':'+m;
      TIME_SLOTS.push(t);
      ['00','30'].forEach(m2=>{
        const h2=m==='30'?h+1:h;
        const t2=String(h2).padStart(2,'0')+':'+m2;
        if(h2<=21)TIME_SLOTS.push(t+'-'+t2);
      });
    });
  }
})();

async function refreshMap(){
  // Force re-fetch map data
  const month = _mapState.filterDate.substring(0,7);
  cacheClear('getJobs'+JSON.stringify({month}));
  var btn = document.getElementById('mapRefreshBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .7s linear infinite"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> รีเฟรช...'; }

}

async function _loadMapJobs() {
  const month = _mapState.filterDate.substring(0,7);
  const r = await apiCached('getJobs',{month},30000);
  if(!r.ok){ document.getElementById('mapJobList').innerHTML='<div class="map-no-data"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> โหลดข้อมูลไม่ได้</div>'; return; }

  // Filter by selected date
  const allJobs = r.data;
  const date = _mapState.filterDate;
  const jobs = allJobs.filter(j=>j.ymd===date);
  _mapState.jobs = jobs;

  // Update stats
  _mapState.lastUpdated = Date.now();
  const doneJobs = jobs.filter(j=>j.colT==='งานสำเร็จ');
  const cancelledJobs = jobs.filter(j=>j.colT==='ยกเลิก');
  const locJobs  = jobs.filter(j=>j.location&&j.location.trim());
  const elT=document.getElementById('mapStatTotal'), elD=document.getElementById('mapStatDone'), elC=document.getElementById('mapStatCancelled'), elL=document.getElementById('mapStatLoc');
  if(elT) elT.textContent=jobs.length;
  if(elD) elD.textContent=doneJobs.length;
  if(elC) elC.textContent=cancelledJobs.length;
  if(elL) elL.textContent=locJobs.length;
  // Update refresh button
  var rbtn = document.getElementById('mapRefreshBtn');
  if(rbtn){ rbtn.disabled=false; rbtn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Refresh'; }
  // Update updated time label
  var utime = document.getElementById('mapUpdatedTime');
  if(utime) utime.textContent = 'Updated '+new Date(_mapState.lastUpdated).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});

  // Render sidebar list
  _renderMapSidebar(jobs);

  // Resolve coordinates for done jobs with location
  await _plotMapMarkers(jobs);
}

      </div>

async function _plotMapMarkers(jobs) {
  if(!_mapState.map) return;
  // Clear old markers/lines (keep home)
  _mapState.markers.forEach(m=>_mapState.map.removeLayer(m));
  _mapState.lines.forEach(l=>_mapState.map.removeLayer(l));
  _mapState.markers=[]; _mapState.lines=[];

  const doneWithLoc = jobs
    .filter(function(j){ return j.colT==='งานสำเร็จ' && j.location && j.location.trim(); })
    .map(function(j,i){
      var jj = Object.assign({},j); jj._seq=i+1; return jj;
    });

  if(!doneWithLoc.length) return;

  // Resolve all coordinates — GPS col Q takes priority over location URL
  const coords = await Promise.all(doneWithLoc.map(function(j){ return _resolveCoords(j.location, j.gps||''); }));

  const validPts = [];
  var totalDist = 0;
  var totalSecs = 0;
  var prevLatLng = null;
  var validCoords = []; // เก็บ coords ที่ valid ทั้งหมดพร้อม index

  // รวบรวม valid coords ก่อน
  doneWithLoc.forEach(function(j,i){
    const co = coords[i];
    if(!co) return;
    validPts.push([co.lat, co.lng]);
    validCoords.push({j:j, co:co, latlng:[co.lat,co.lng]});
  });

  // วาง markers ทุกจุดก่อน
  validCoords.forEach(function(item){
    var j = item.j; var latlng = item.latlng;
    const markerHtml = '<div style="width:34px;height:34px;background:#F97316;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;cursor:pointer">'+j._seq+'</div>';
    const icon = L.divIcon({className:'',html:markerHtml,iconSize:[34,34],iconAnchor:[17,17]});
    const popupHtml = '<div class="map-popup">'
      +'<div class="map-popup-no">'+escapeHtml(j.jobNo)+'</div>'
      +'<div class="map-popup-company"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+escapeHtml(j.company)+'</div>'
      +'<div class="map-popup-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+escapeHtml(j.time)+'</div>'
      +'<div class="map-popup-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+escapeHtml(j.place||'-')+'</div>'
      +'<div class="map-popup-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'+escapeHtml(j.user)+'</div>'
      +(j.types.length?'<div class="map-popup-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'+escapeHtml(j.types.join(', '))+'</div>':'')
      +'<div><span class="map-popup-status" style="background:#ECFDF5;color:#047857"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><polyline points="20 6 9 17 4 12"/></svg>งานสำเร็จ</span></div>'
      +(j.location?'<div style="margin-top:8px"><a href="'+escapeHtml(j.location)+'" target="_blank" style="font-size:11px;color:#2563EB;display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> เปิด Google Maps</a></div>':'')
      +'</div>';
    const marker = L.marker(latlng,{icon}).bindPopup(popupHtml,{maxWidth:260}).addTo(_mapState.map);
    _mapState.markers.push(marker);
    const jobIdx = jobs.findIndex(function(jj){return jj.jobNo===j.jobNo;});
    if(jobIdx>=0){
      marker.on('click',function(){
        document.querySelectorAll('.map-job-item').forEach(function(el){el.classList.remove('active');});
        const el=document.getElementById('mapItem-'+jobIdx);
        if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'});}
      });
    }
  });

  // ── Palette สีแต่ละ segment ──────────────────────────────────
  // segment 0 = สำนักงาน→1 (สีฟ้าเข้ม), 1→2, 2→3, ... แต่ละเส้นสีต่างกัน
  var SEG_COLORS = [
    '#1D4ED8', // สำนักงาน → 1  (Navy Blue)
    '#059669', // 1 → 2          (Emerald)
    '#D97706', // 2 → 3          (Amber)
    '#7C3AED', // 3 → 4          (Violet)
    '#DC2626', // 4 → 5          (Red)
    '#0891B2', // 5 → 6          (Cyan)
    '#BE185D', // 6 → 7          (Pink)
    '#65A30D', // 7 → 8          (Lime)
    '#EA580C', // 8 → 9          (Orange)
    '#4338CA'  // 9 → 10+        (Indigo)
  ];

  // วาดเส้นทางจริงด้วย OSRM (ทีละ segment)
  // — เริ่มต้นจากสำนักงานไปหาจุดที่ 1 เสมอ
  if(validCoords.length >= 1){
    var routePromises = [];
    // Segment 0: สำนักงาน → จุดที่ 1
    routePromises.push(_fetchOSRMRoute(OFFICE_COORD, validCoords[0].co, -1));
    // Segments ถัดไป: จุด 1 → 2 → 3 → ...
    for(var ri=0; ri<validCoords.length-1; ri++){
      routePromises.push(_fetchOSRMRoute(
        validCoords[ri].co, validCoords[ri+1].co, ri
      ));
    }
    var results = await Promise.all(routePromises);
    var legendRows = '';
    results.forEach(function(res, si){
      if(!res) return;
      totalDist += res.dist;
      totalSecs += res.secs;
      var color = SEG_COLORS[si % SEG_COLORS.length];
      var line = L.polyline(res.coords, {
        color: color, weight: 5, opacity: .9
      }).addTo(_mapState.map);
      _mapState.lines.push(line);
      // legend label
      var fromLabel = si === 0 ? 'สำนักงาน' : 'จุด ' + si;
      var toLabel   = 'จุด ' + (si + 1);
      legendRows += '<div class="map-legend-row">'
        + '<div class="map-legend-line" style="background:'+color+'"></div>'
        + '<div class="map-legend-label">'+fromLabel+' → '+toLabel+'</div>'
        + '<div class="map-legend-dist">'+res.dist.toFixed(1)+' กม.</div>'
        + '</div>';
    });
    // แสดง legend ใน route info
    var legEl = document.getElementById('mapRouteLegend');
    if(legEl) legEl.innerHTML = legendRows;
  }

  // แสดง route info จากข้อมูลจริง
  if(totalDist>0){
    const ri=document.getElementById('mapRouteInfo');
    if(ri){
      ri.style.display='block';
      document.getElementById('mapRouteDist').textContent=totalDist.toFixed(1);
      // ใช้เวลาจริงจาก OSRM (วินาที)
      var dispTime = '';
      if(totalSecs>0){
        var h=Math.floor(totalSecs/3600), m=Math.floor((totalSecs%3600)/60);
        dispTime = ''+(h?h+'h ':'')+m+'min (actual route)';
      }
      document.getElementById('mapRouteTime').textContent=dispTime;
    }
  }

  // Fit map to markers
  if(validPts.length>0){
    var allPts = [[13.7329403,100.4953048]].concat(validPts);
    _mapState.map.fitBounds(L.latLngBounds(allPts).pad(0.15));
  }
}

function mapFocusJob(idx){
  document.querySelectorAll('.map-job-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('mapItem-'+idx);
  if(el) el.classList.add('active');

  const j = _mapState.jobs[idx];
  if(!j||!j.location) return;

  // Find marker for this job
  const doneWithLoc = _mapState.jobs.filter(jj=>jj.colT==='งานสำเร็จ'&&jj.location);
  const mIdx = doneWithLoc.findIndex(jj=>jj.jobNo===j.jobNo);
  if(mIdx>=0 && _mapState.markers[mIdx]){

// ── OSRM Real Road Routing ───────────────────────────────────
// ใช้ OSRM public server (router.project-osrm.org) — ฟรี ไม่ต้อง API key
async function _fetchOSRMRoute(fromCo, toCo, segIdx) {
  try {
    var url = 'https://router.project-osrm.org/route/v1/driving/'
      + fromCo.lng + ',' + fromCo.lat + ';'
      + toCo.lng   + ',' + toCo.lat
      + '?overview=full&geometries=geojson&steps=false';

    var resp = await fetch(url);
    if(!resp.ok) return _fallbackLine(fromCo, toCo);
    var data = await resp.json();

    if(!data.routes || !data.routes.length) return _fallbackLine(fromCo, toCo);

    var route  = data.routes[0];
    var distKm = route.distance / 1000;
    var secs   = route.duration;

    // แปลง GeoJSON coordinates [lng,lat] → Leaflet [lat,lng]
    var rawCoords = route.geometry.coordinates;
    var leafletCoords = rawCoords.map(function(c){ return [c[1], c[0]]; });

    return { dist: distKm, secs: secs, coords: leafletCoords };
  } catch(e) {
    return _fallbackLine(fromCo, toCo);
  }
}

// fallback: เส้นตรงถ้า OSRM ไม่ตอบ
function _fallbackLine(fromCo, toCo) {
  var dist = _haversine(fromCo.lat, fromCo.lng, toCo.lat, toCo.lng);
  return {
    dist:   dist,
    secs:   Math.round(dist / 40 * 3600),
    coords: [[fromCo.lat, fromCo.lng], [toCo.lat, toCo.lng]]
  };
}

// ── Coordinate resolver ─────────────────────────────────────
var _coordCache = {};
async function _resolveCoords(locStr, gpsStr) {
  // Priority 1: direct GPS from col Q (format "lat,lng")
  if(gpsStr && gpsStr.trim()) {
    var gm = gpsStr.trim().match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
    if(gm){ var gc={lat:parseFloat(gm[1]),lng:parseFloat(gm[2])}; _coordCache[gpsStr]=gc; return gc; }
  }

  if(!locStr) return null;
  if(_coordCache[locStr]) return _coordCache[locStr];

  // Try extract lat,lng from Google Maps URL patterns
  // Pattern 1: @lat,lng
  let m = locStr.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if(m){ const c={lat:parseFloat(m[1]),lng:parseFloat(m[2])}; _coordCache[locStr]=c; return c; }

  // Pattern 2: /place/.../@lat,lng or ll=lat,lng
  m = locStr.match(/[?&]ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if(m){ const c={lat:parseFloat(m[1]),lng:parseFloat(m[2])}; _coordCache[locStr]=c; return c; }

  // Pattern 3: maps?q=lat,lng
  m = locStr.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if(m){ const c={lat:parseFloat(m[1]),lng:parseFloat(m[2])}; _coordCache[locStr]=c; return c; }

  // Pattern 4: direct lat,lng string "13.75,100.52"
  m = locStr.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
  if(m){ const c={lat:parseFloat(m[1]),lng:parseFloat(m[2])}; _coordCache[locStr]=c; return c; }

  // Shortened URL (maps.app.goo.gl) — try fetch redirect to resolve final URL
  if(locStr.includes('goo.gl')||locStr.includes('maps.app')){
    try {
      // Use Google Maps Geocoding workaround via embed hint
      // Extract place ID or use a fallback — skip for security in GAS context
      // Return null, cannot resolve short URL in browser without CORS
      return null;
    } catch(e){ return null; }
  }

  return null;
}

// ── Haversine distance (km) ──────────────────────────────────
function _haversine(lat1,lng1,lat2,lng2){
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.pow(Math.sin(dLat/2),2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.pow(Math.sin(dLng/2),2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

        a: '<p>ไปที่ <strong>Admin → จัดการ Users</strong> แล้ว:</p><ul><li>กด <strong>"+ เพิ่ม User"</strong> เพื่อเพิ่มผู้ใช้ใหม่</li><li>กรอก ชื่อ, บทบาท (Role), แผนก</li><li>คลิกที่ User เพื่อแก้ไขหรือลบ</li></ul>',
        icon: FI.users
      },
      {
        q: 'ส่งออกข้อมูลงานเป็น Excel ได้ไหม?',
        a: '<p>ข้อมูลทั้งหมดถูกเก็บใน <strong>Google Sheets</strong> อยู่แล้ว สามารถ:</p><ul><li>เปิด Google Sheets ต้นฉบับ แล้ว Download as Excel (.xlsx)</li><li>ใช้ฟังก์ชัน Export ใน Admin Panel (ถ้ามีการเปิดใช้)</li></ul><div class="faq-tip">Google Sheets รองรับการ Filter, Sort, และสร้าง Chart ได้โดยตรง</div>',
        icon: FI.barChart2
      }
    ]
  }
];

function loadFAQ() {
  var c = document.getElementById('adminTabContent');
  if(!c) return;
  c.innerHTML = '<div id="faqPage">' + _buildFAQHtml() + '</div>';
  _bindFAQEvents();
}
function renderFAQ() {
  var root = document.getElementById('page');
  root.innerHTML = '<div class="page" id="faqPage">' + _buildFAQHtml() + '</div>';
  _bindFAQEvents();
}

function _buildFAQHtml() {
  var cats = ['all'].concat(FAQ_DATA.map(function(g){ return g.cat; }));
  var catPills = cats.map(function(c){
    var iconSvg = c === 'all' ? FI.filter : FAQ_DATA.find(function(g){return g.cat===c;}).icon;
    return '<button class="faq-cat-pill'+(c===_faqFilter?' active':'')+'" data-faq-cat="'+escapeHtml(c)+'"><span style="display:inline-flex;align-items:center;gap:5px;vertical-align:middle">'+iconSvg+' '+(c==='all'?'ทั้งหมด':escapeHtml(c))+'</span></button>';
  }).join('');

  var groups = '';
  FAQ_DATA.forEach(function(group){
    if(_faqFilter !== 'all' && _faqFilter !== group.cat) return;
    var items = group.items.filter(function(item){
      if(!_faqSearch) return true;
      var q = (_faqSearch||'').toLowerCase();
      return item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q);
    });
    if(!items.length) return;
    groups += '<div class="faq-group">';
    groups += '<div class="faq-group-title"><span style="display:inline-flex;align-items:center;opacity:.6">'+group.icon+'</span> '+escapeHtml(group.cat)+'</div>';
    items.forEach(function(item, i){
      var id = 'faqItem-'+group.cat.replace(/\s/g,'_')+'-'+i;
      groups += '<div class="faq-item" id="'+id+'">';
      groups += '<div class="faq-q" data-faq-id="'+id+'">';
      groups += '<div class="faq-q-icon">'+item.icon+'</div>';
      groups += '<div class="faq-q-text">'+escapeHtml(item.q)+'</div>';
      groups += '<div class="faq-q-arrow">'+FI.chevronDown+'</div>';
      groups += '</div>';
      groups += '<div class="faq-a"><div class="faq-a-inner">'+item.a+'</div></div>';
      groups += '</div>';
    });
    groups += '</div>';
  });

  if(!groups) {
    groups = '<div class="faq-no-result"><div class="faq-no-icon">'+FI.helpCircle+'</div><h3>ไม่พบคำถามที่ตรงกัน</h3><p>ลองค้นหาด้วยคำอื่น หรือเลือกหมวดหมู่อื่น</p></div>';
  }

  return '<div class="faq-hero"><div class="faq-hero-badge">Help Center</div><div class="faq-hero-title">คำถามที่พบบ่อย</div><div class="faq-hero-sub">ค้นหาคำตอบสำหรับคำถามที่พบบ่อยเกี่ยวกับระบบ Messenger</div></div>'
    + '<div class="faq-search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="faq-search" id="faqSearchInput" type="text" placeholder="ค้นหาคำถาม..." value="'+escapeHtml(_faqSearch)+'"></div>'
    + '<div class="faq-cats">'+catPills+'</div>'
    + groups;
}

function _bindFAQEvents() {
  var si = document.getElementById('faqSearchInput');
  if(si) si.addEventListener('input', function(){ _faqSearch = this.value; _refreshFAQ(); });

  document.querySelectorAll('[data-faq-cat]').forEach(function(b){
    b.addEventListener('click', function(){ _faqFilter = this.dataset.faqCat; _refreshFAQ(); });
  });

  document.querySelectorAll('[data-faq-id]').forEach(function(b){
    b.addEventListener('click', function(){
      var card = document.getElementById(this.dataset.faqId);
      if(card) card.classList.toggle('open');
    });
  });
}

function _refreshFAQ() {
  var page = document.getElementById('faqPage');
  if(!page) return;
  page.innerHTML = _buildFAQHtml();
  _bindFAQEvents();
}

// ── Start (must be last) ─────────────────────────────────────
init();
</script>
</body>
</html>
