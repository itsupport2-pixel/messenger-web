<html lang="th">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-light:#3B82F6;
  --accent:#60A5FA; --success:#10B981; --warning:#F59E0B; --danger:#EF4444; --info:#0EA5E9;
  --bg:#0F172A; --bg-app:#F8FAFC; --bg-card:#FFFFFF; --bg-hover:#F1F5F9; --bg-muted:#F8FAFC; --bg-dark:#1E293B;
  --text:#0F172A; --text-strong:#020617; --text-muted:#64748B; --text-light:#94A3B8;
  --border:#E2E8F0; --border-strong:#CBD5E1; --border-dark:#334155;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.10),0 4px 12px rgba(15,23,42,.06);
  --shadow-xl:0 24px 48px rgba(15,23,42,.14);
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Sarabun','Inter',sans-serif;background:var(--bg-app);color:var(--text);font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-light)}
.app{max-width:1280px;margin:0 auto}
.navbar{background:linear-gradient(135deg,#0B1628 0%,#0F2444 60%,#162C50 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(99,137,196,.18);box-shadow:0 2px 24px rgba(0,0,0,.35);height:62px}
.navbar-brand .brand-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.navbar-brand .brand-sub{font-size:10.5px;color:rgba(148,163,184,.7);font-weight:500;letter-spacing:.01em}
.navbar-tabs{display:flex;gap:1px;background:rgba(255,255,255,.05);border-radius:12px;padding:4px}
.navbar-tabs button{padding:7px 15px;border-radius:9px;color:rgba(203,213,225,.65);font-size:13px;font-weight:500;transition:all .18s;display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.navbar-tabs button .nav-icon{opacity:.7;display:flex;flex-shrink:0;transition:opacity .18s}
.navbar-tabs button:hover{color:#fff;background:rgba(255,255,255,.1)}
.navbar-tabs button:hover .nav-icon{opacity:1}
.navbar-tabs button.active{color:#fff;background:linear-gradient(135deg,rgba(59,130,246,.45),rgba(37,99,235,.35));font-weight:700;box-shadow:inset 0 0 0 1px rgba(99,155,255,.4),0 2px 8px rgba(37,99,235,.3)}
.navbar-tabs button.active .nav-icon{opacity:1}
.navbar-brand{display:flex;align-items:center;gap:12px;font-weight:700}
.navbar-brand .logo-fallback{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 2px 12px rgba(37,99,235,.45);border:1px solid rgba(255,255,255,.15)}
.navbar-brand img{height:36px;border-radius:9px;padding:2px;border:1px solid rgba(255,255,255,.12)}
.navbar-brand .brand-text{display:flex;flex-direction:column;line-height:1.2}
.navbar-actions #btnNewJob{padding:8px 18px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .18s;box-shadow:0 2px 10px rgba(37,99,235,.4);letter-spacing:.01em}
.navbar-actions #btnNewJob:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(37,99,235,.5)}
.navbar-actions #btnNewJob:active{transform:translateY(0)}
@media(max-width:768px){.navbar{padding:0 14px;height:54px}.navbar-tabs{display:none}.navbar-brand .brand-sub{display:none}}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(15,23,42,.06)}
.bottom-nav-inner{display:flex;justify-content:space-around;max-width:600px;margin:0 auto}
.bottom-nav button{flex:1;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:10px;font-weight:600;transition:color .15s}
.bottom-nav button .icon{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.bottom-nav button.active{color:var(--primary)}
@media(max-width:768px){.bottom-nav{display:block}}
.page{padding:24px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.page{padding:16px}}
.page-head{margin-bottom:24px}
.page-title{font-size:24px;font-weight:800;color:var(--text-strong);margin-bottom:4px;letter-spacing:-.02em}
.page-subtitle{font-size:13px;color:var(--text-muted)}
.card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-xs);padding:20px;margin-bottom:16px;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-sm)}
.card-title{font-size:15px;font-weight:700;color:var(--text-strong);margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:.01em}
.form-label .req{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);transition:all .15s;font-size:14px}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow)}
.form-input::placeholder{color:var(--text-light)}
.form-textarea{resize:vertical;min-height:90px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-hint{font-size:11px;color:var(--text-light);margin-top:5px;line-height:1.5}
.checkbox-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.checkbox-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;background:#fff;font-size:13px;font-weight:500;user-select:none}
.checkbox-item:hover{border-color:var(--primary-light);background:#F0F7FF}
.checkbox-item input{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.checkbox-item.checked{border-color:var(--primary);background:#EFF6FF;color:var(--primary-dark);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .15s;cursor:pointer;letter-spacing:.01em}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 2px 8px var(--primary-glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px var(--primary-glow)}
.btn-secondary{background:var(--bg-hover);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#DC2626}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid rgba(226,232,240,.7);border-radius:var(--radius-lg);padding:20px 20px 16px;position:relative;overflow:hidden;transition:all .25s cubic-bezier(.4,0,.2,1);outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.stat-card:focus,.stat-card:focus-visible{outline:none!important;box-shadow:none!important}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(15,23,42,.1),0 4px 12px rgba(15,23,42,.06);border-color:transparent}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,var(--primary),var(--primary-light))}
.stat-card.success::before{background:linear-gradient(180deg,var(--success),#34D399)}
.stat-card.warning::before{background:linear-gradient(180deg,var(--warning),#FCD34D)}
.stat-card.danger::before{background:linear-gradient(180deg,var(--danger),#F87171)}
.stat-card::after{content:'';position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;opacity:.04;background:var(--primary)}
.stat-card.success::after{background:var(--success)}
.stat-card.warning::after{background:var(--warning)}
.stat-card.danger::after{background:var(--danger)}
.stat-label{font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase}
.stat-value{font-size:32px;font-weight:800;color:var(--text-strong);line-height:1;letter-spacing:-.03em;font-family:'Inter','Sarabun',sans-serif}
.stat-icon{position:absolute;right:18px;top:18px;font-size:24px;opacity:.18}
.stat-trend{font-size:11px;color:var(--text-light);margin-top:10px;font-weight:500;display:flex;align-items:center;gap:4px}
/* ── CALENDAR — redesigned ── */
.calendar{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 2px 16px rgba(15,23,42,.06)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-title{font-size:22px;font-weight:800;color:var(--text-strong);letter-spacing:-.02em}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{width:38px;height:38px;border-radius:12px;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);font-size:17px;transition:all .15s;border:1px solid var(--border)}
.cal-nav button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.cal-nav .btn-today{width:auto;padding:0 16px;font-size:12px;font-weight:700;letter-spacing:.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--text-light);padding:10px 0 8px;letter-spacing:.06em;text-transform:uppercase}
.cal-cell{border-radius:12px;padding:10px 10px 8px;background:#FAFBFD;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:1.5px solid #EEF2F7;transition:all .18s;min-height:90px;position:relative}
.cal-cell:hover{border-color:var(--primary);background:#EFF6FF;box-shadow:0 4px 14px rgba(37,99,235,.10);transform:translateY(-1px)}
.cal-cell.today{border-color:var(--primary);background:linear-gradient(145deg,#EFF6FF,#DBEAFE);box-shadow:0 4px 16px rgba(37,99,235,.14)}
.cal-cell.today .cal-date{background:var(--primary);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.cal-cell.today .cal-date-wrap{display:flex;align-items:center;gap:0}
.cal-cell.has-jobs{border-color:#BFDBFE;background:#F8FBFF}
.cal-cell.has-jobs:hover{border-color:var(--primary)}
.cal-cell.empty{background:transparent;cursor:default;border-color:transparent}
.cal-cell.empty:hover{transform:none;background:transparent;box-shadow:none}
.cal-date{font-size:14px;font-weight:700;color:var(--text-strong);line-height:1}
.cal-date-wrap{display:flex;align-items:center}
.cal-events{display:flex;flex-direction:column;gap:3px;flex:1}
.cal-event-chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;max-width:100%}
.cal-event-chip.chip-normal{background:#EFF6FF;color:#1D4ED8}
.cal-event-chip.chip-urgent{background:#FEF2F2;color:#DC2626}
.cal-event-chip.chip-done{background:#ECFDF5;color:#047857}
.cal-event-more{font-size:10px;color:var(--text-muted);font-weight:700;padding:1px 6px;background:#F1F5F9;border-radius:6px;align-self:flex-start;line-height:1.6}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap}
.cal-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.cal-dot.urgent{background:var(--danger)}
.cal-dot.done{background:var(--success)}
.cal-count{font-size:10px;color:var(--text-muted);font-weight:700}
.cal-legend{margin-top:20px;display:flex;gap:20px;font-size:12px;color:var(--text-muted);justify-content:center;flex-wrap:wrap;font-weight:600;padding-top:16px;border-top:1px solid var(--border)}
.cal-legend-item{display:inline-flex;align-items:center;gap:6px}
.cal-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
@media(max-width:768px){
  .cal-cell{min-height:70px;padding:7px 7px 6px;border-radius:10px}
  .cal-event-chip{font-size:9.5px;padding:2px 5px}
  .calendar{padding:16px}
  .cal-title{font-size:17px}
  .cal-date{font-size:13px}
}
@media(max-width:520px){
  .cal-cell{min-height:52px;padding:5px 5px 4px;border-radius:8px;gap:3px}
  .cal-event-chip{display:none}
  .cal-dots{display:flex}
  .cal-event-more{font-size:9px;padding:1px 4px}
  .cal-date{font-size:11px}
  .cal-count{font-size:9px}
  .calendar{padding:12px}
  .cal-day-name{font-size:10px;padding:6px 0}
  .cal-cell.today .cal-date{width:22px;height:22px;font-size:11px}
}
.job-list{display:flex;flex-direction:column;gap:10px}

/* ── JOB CARD — Executive Accordion ── */
.job-card{background:#fff;border-radius:var(--radius-lg);border:1px solid rgba(226,232,240,.8);border-left:none;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(15,23,42,.05)}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,var(--primary),var(--primary-light));transition:width .2s}
.job-card:hover{box-shadow:0 8px 24px rgba(15,23,42,.09),0 2px 8px rgba(15,23,42,.05);transform:translateY(-1px);border-color:rgba(226,232,240,.4)}
.job-card.urgent::before{background:linear-gradient(180deg,var(--danger),#F87171)}
.job-card.done::before{background:linear-gradient(180deg,var(--success),#34D399)}
.job-card.pending::before{background:linear-gradient(180deg,var(--warning),#FCD34D)}
.job-card.cancelled::before{background:linear-gradient(180deg,#DC2626,#F87171)}
.job-card.cancelled{opacity:.75}

/* Card Header (always visible) */
.job-card-header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none}
.job-card-header-left{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.job-card-header-right{display:flex;align-items:center;gap:12px;flex-shrink:0}

.job-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.job-no{font-size:11px;font-weight:700;color:var(--primary);background:rgba(37,99,235,.07);padding:3px 10px;border-radius:6px;font-family:'Inter','Sarabun',sans-serif;letter-spacing:.02em}
.job-status{font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.status-done{background:#ECFDF5;color:#047857}
.status-pending{background:#FFFBEB;color:#B45309}
.status-new{background:rgba(37,99,235,.07);color:#1D4ED8}
.status-cancelled{background:#FEF2F2;color:#DC2626}
.job-title{font-size:15px;font-weight:700;color:var(--text-strong);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-muted);margin-bottom:0}
.job-meta span{display:inline-flex;align-items:center;gap:4px}
.job-types{display:flex;flex-wrap:wrap;gap:4px}
.job-tag{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--bg-hover);color:var(--text-muted);font-weight:600;border:1px solid var(--border)}
.job-urgent-flag{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--danger),#F87171);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}

/* Accordion Arrow */
.job-accordion-arrow{width:28px;height:28px;border-radius:50%;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s cubic-bezier(.4,0,.2,1);color:var(--text-muted);font-size:13px}
.job-card.open .job-accordion-arrow{transform:rotate(180deg);background:rgba(37,99,235,.09);color:var(--primary)}

/* Accordion sent status badge */
.job-sent-badge{font-size:11px;font-weight:600;color:var(--success);display:flex;align-items:center;gap:4px;white-space:nowrap}
.job-sent-badge.unsent{color:var(--text-light)}

/* Accordion Body */
.job-accordion-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.job-card.open .job-accordion-body{max-height:400px}
.job-accordion-inner{padding:0 18px 16px;border-top:1px solid rgba(226,232,240,.6);padding-top:14px}
.job-accordion-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.job-accordion-grid{grid-template-columns:1fr}}
.job-detail-item{display:flex;flex-direction:column;gap:3px}
.job-detail-label{font-size:10px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em}
.job-detail-value{font-size:13px;font-weight:500;color:var(--text-strong);line-height:1.5}
.job-accordion-tags{display:flex;flex-wrap:wrap;gap:5px;padding-top:10px;border-top:1px dashed var(--border);margin-top:10px}
.job-accordion-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.job-accordion-actions button{flex:1;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:all .15s;cursor:pointer;font-family:inherit}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal{background:#fff;border-radius:var(--radius-xl);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease;box-shadow:var(--shadow-xl)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#0F172A,#1E293B);color:#fff;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;transition:background .15s}
.modal-close:hover{background:rgba(255,255,255,.2)}
.modal-body{padding:22px}
.detail-row{display:flex;padding:10px 0;border-bottom:1px solid var(--border);gap:14px}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:12px;color:var(--text-muted);font-weight:600;width:96px;flex-shrink:0}
.detail-value{font-size:13px;color:var(--text-strong);flex:1;line-height:1.6;font-weight:500}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px}
.list-status-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #E2E8F0;background:#FAFBFC;color:#64748B;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;outline:none;-webkit-tap-highlight-color:transparent}
.list-status-pill:hover{border-color:#94A3B8;background:#F1F5F9;color:#374151}
.list-status-pill.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow)}
.list-status-pill.pending.active{background:#F59E0B;border-color:#F59E0B;color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.25)}
.list-status-pill.done.active{background:#10B981;border-color:#10B981;color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.list-status-pill.new.active{background:#6366F1;border-color:#6366F1;color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.25)}
.list-status-pill.cancelled.active{background:#DC2626;border-color:#DC2626;color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.25)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:13px;z-index:2000;box-shadow:var(--shadow-xl);animation:slideDown .25s;display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
@keyframes slideDown{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-muted);gap:10px;font-size:13px;font-weight:500}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .icon{font-size:54px;margin-bottom:12px;opacity:.4}
.empty .text{font-size:14px;font-weight:500}
.login-wrapper{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:36px;width:100%;max-width:400px}
.login-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 24px var(--primary-glow)}.login-icon svg{width:28px;height:28px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.login-title{font-size:22px;font-weight:800;text-align:center;color:var(--text-strong);margin-bottom:6px}
.login-sub{font-size:13px;text-align:center;color:var(--text-muted);margin-bottom:26px}
.login-hint{text-align:center;font-size:11px;color:var(--text-light);margin-top:18px;background:var(--bg-hover);padding:10px;border-radius:8px;border:1px dashed var(--border)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg-muted);font-weight:700;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-hover)}
.color-chip{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border-strong);vertical-align:middle}

/* ── FIX 1: date input mobile overflow fix ── */
input[type="date"]{
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  -webkit-appearance:none;
  appearance:none;
  font-size:16px!important;
  box-sizing:border-box!important;
}

/* ── FIX 2: time spinner 2-field ── */
.time-spinner-row{display:flex;align-items:center;gap:8px;width:100%}
.time-spinner-sep{font-size:18px;font-weight:700;color:var(--text-muted);flex-shrink:0;line-height:1}
.spinner-wrap{flex:1;min-width:0}
.spinner-wrap input[type="time"]{
  width:100%;
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;
  color:var(--text);
  font-size:16px;
  font-family:inherit;
  -webkit-appearance:none;
  appearance:none;
  cursor:pointer;
  transition:all .15s;
  box-sizing:border-box;
}
.spinner-wrap input[type="time"]:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-glow);
}
@media(max-width:600px){
  .spinner-wrap input[type="time"]{font-size:15px;padding:10px 8px}
  .time-spinner-sep{font-size:14px}
}

.fab{position:fixed;bottom:90px;right:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--primary-glow);z-index:90;transition:all .2s;font-weight:300}
.fab:hover{transform:scale(1.05) rotate(90deg);box-shadow:0 12px 32px var(--primary-glow)}
@media(min-width:769px){.fab{bottom:30px;right:30px}}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.section-head h3{font-size:15px;font-weight:700;color:var(--text-strong);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sh-accent{display:inline-block;width:4px;height:16px;background:linear-gradient(180deg,var(--primary),var(--primary-light));border-radius:2px;flex-shrink:0}
.sh-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;border-radius:20px;margin-left:4px}

/* ── HOME HEADER — Analytics Style ── */
.home-header{background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 60%,#EDE9FE 100%);border-radius:var(--radius-xl);padding:26px 28px 22px;margin-bottom:20px;border:1px solid #BFDBFE;position:relative;overflow:hidden}
.home-header::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);pointer-events:none}
.home-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-title{font-size:22px;font-weight:800;color:#1E3A5F;letter-spacing:-.02em;line-height:1.2}
.home-subtitle{font-size:12px;color:#3B82F6;margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:500}
.home-sub-sep{color:#93C5FD}
.home-date-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #BFDBFE;border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;color:#1E40AF;box-shadow:0 2px 8px rgba(37,99,235,.1);white-space:nowrap}
.home-date-badge .live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0;animation:livePulse 2s infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}60%{box-shadow:0 0 0 5px rgba(16,185,129,.0)}}
.hero{display:none}
.hero-greet,.hero-title,.hero-sub,.hero-content{display:none}

/* ── STAT CARDS — Analytics Horizontal ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid #E8EDF2;border-left:4px solid #CBD5E1;border-radius:16px;padding:20px 20px 0;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 1px 8px rgba(15,23,42,.06)}
.stat-card:hover{box-shadow:0 8px 24px rgba(15,23,42,.11);transform:translateY(-2px)}
.stat-card::before{display:none}
.stat-card::after{display:none}
.stat-card-active{box-shadow:0 8px 24px rgba(15,23,42,.13)!important;transform:translateY(-2px)!important}
.stat-card-icon-wrap{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex-shrink:0}
.stat-card-icon-wrap svg{width:22px;height:22px}
.stat-card-icon-wrap.blue{background:#EFF6FF;color:#2563EB}
.stat-card-icon-wrap.green{background:#ECFDF5;color:#059669}
.stat-card-icon-wrap.amber{background:#FFFBEB;color:#D97706}
.stat-card-icon-wrap.red{background:#FEF2F2;color:#DC2626}
.stat-card-body{flex:1;padding-bottom:14px}
.stat-card-footer-line{border-top:1px solid #F1F5F9;padding:9px 0;display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.stat-card-footer-line span{font-size:11px;color:#CBD5E1;font-weight:500}
.stat-label{font-size:9.5px;color:#94A3B8;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;line-height:1}
.stat-value{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.03em;font-family:'Inter','Sarabun',sans-serif}
.stat-icon{display:none}
.stat-trend{font-size:11px;color:#94A3B8;margin-top:6px;font-weight:500}
.stat-arrow{display:none}
@media(max-width:700px){
  .stats-grid{grid-template-columns:1fr 1fr}
  /* mobile stat cards — handled by grid gap */
  .stat-value{font-size:26px}
  .home-header{padding:18px 16px}
  .home-title{font-size:17px}
}
@media(max-width:400px){.stats-grid{grid-template-columns:1fr 1fr}}

/* ── SECTION HEAD ── */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;scroll-margin-top:80px;border-radius:8px;padding:6px 8px;margin-left:-8px;margin-right:-8px;transition:background .3s}
.section-head h3{font-size:15px;font-weight:700;color:var(--text-strong);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sh-accent{display:inline-block;width:4px;height:16px;background:linear-gradient(180deg,var(--primary),var(--primary-light));border-radius:2px;flex-shrink:0}
.sh-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;border-radius:20px;margin-left:2px}
@keyframes jobsFlash{0%{background:rgba(37,99,235,.0);transform:scale(1)}20%{background:rgba(37,99,235,.06);transform:scale(1.003)}60%{background:rgba(37,99,235,.04)}100%{background:transparent;transform:scale(1)}}
.jobs-flash{animation:jobsFlash .9s ease forwards}
@keyframes sectionFlash{0%,100%{background:transparent}30%{background:rgba(37,99,235,.08)}70%{background:rgba(37,99,235,.04)}}
.section-flash{animation:sectionFlash .8s ease forwards}
.user-menu{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.user-info{display:flex;flex-direction:column;line-height:1.3}
.user-name{font-size:13px;font-weight:700;color:var(--text-strong)}
.user-role{font-size:11px;color:var(--text-muted)}
@media(max-width:600px){ .hide-mobile{ display:none!important } }

.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;margin:0 auto 12px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 16px var(--primary-glow)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.profile-avatar .edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:20px}
.profile-avatar:hover .edit-overlay{opacity:1}
.api-error-banner{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:13px;color:#991B1B;display:flex;gap:10px;align-items:flex-start}
.api-error-banner .icon{font-size:18px;flex-shrink:0}
/* ── DATE RANGE BUTTON (home) ── */
.drp-home-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #BFDBFE;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#1E40AF;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(37,99,235,.08);white-space:nowrap;user-select:none}
.drp-home-btn:hover{border-color:#93C5FD;background:#EFF6FF;box-shadow:0 4px 12px rgba(37,99,235,.12)}
.drp-home-icon{font-size:15px}
.drp-home-arrow{font-size:11px;color:#60A5FA;transition:transform .2s}
.drp-home-btn:hover .drp-home-arrow{transform:rotate(180deg)}

/* ── DASHBOARD CHARTS ROW ── */
.dash-charts-row{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-bottom:24px}
@media(max-width:860px){.dash-charts-row{grid-template-columns:1fr}}
.dash-chart-card{background:#fff;border:1.5px solid #DBEAFE;border-radius:var(--radius-lg);padding:20px;box-shadow:0 2px 10px rgba(37,99,235,.06)}
.dash-chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:8px}
.dash-chart-title{font-size:13px;font-weight:700;color:#0F172A}
.dash-chart-sub{font-size:11px;color:#94A3B8;font-weight:500}
.dash-chart-body{position:relative;height:130px}
.dash-donut-wrap{display:flex;align-items:center;gap:18px;height:auto!important;min-height:140px}
.dash-donut-legend{display:flex;flex-direction:column;gap:9px;flex:1}
.dash-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#475569;font-weight:500}
.dash-legend-item strong{color:#0F172A;font-weight:700;margin-left:auto;font-family:'Inter','Sarabun',sans-serif}
.dash-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── Date Range Picker — Mobile First ── */
.drp-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:border-color .15s;white-space:nowrap}
.drp-btn:hover{border-color:var(--primary)}
.drp-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:800;align-items:flex-end;justify-content:center}
.drp-modal-overlay.open{display:flex}
.drp-modal{background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(15,23,42,.18);width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
/* Drag handle */
.drp-modal::before{content:'';display:block;width:36px;height:4px;background:#CBD5E1;border-radius:2px;margin:10px auto 6px;flex-shrink:0}
/* Preset chips — horizontal scroll */
.drp-sidebar{display:flex;gap:6px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);flex-shrink:0}
.drp-sidebar::-webkit-scrollbar{display:none}
.drp-sidebar button{display:inline-flex;align-items:center;white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg-hover);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;flex-shrink:0;font-family:inherit}
.drp-sidebar button:hover{border-color:var(--primary);color:var(--primary)}
.drp-sidebar button.drp-active{background:var(--primary);border-color:var(--primary);color:#fff}
/* Calendar body */
.drp-body{padding:12px 16px 0;flex:1;overflow-y:auto}
.drp-cals{display:flex;flex-direction:column;gap:0;margin-bottom:8px}
.drp-cal{width:100%}
.drp-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:15px;padding:4px 0}
.drp-cal-head button{width:36px;height:36px;border-radius:10px;background:var(--bg-hover);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);transition:all .1s;font-family:inherit}
.drp-cal-head button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.drp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px}
.drp-dn{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding:6px 0}
.drp-d{text-align:center;padding:0;font-size:14px;font-weight:500;cursor:pointer;color:var(--text);border-radius:8px;transition:all .1s;height:40px;display:flex;align-items:center;justify-content:center}
.drp-d:hover{background:var(--primary-glow);color:var(--primary)}
.drp-d.drp-dim{color:var(--text-light)}
.drp-d.drp-inr{background:var(--primary-glow);color:var(--primary);border-radius:0}
.drp-d.drp-rs,.drp-d.drp-re{background:var(--primary);color:#fff;font-weight:700;border-radius:8px}
.drp-d.drp-tod{font-weight:800;text-decoration:underline}
/* Footer */
.drp-foot{border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.drp-inp-wrap{display:flex;align-items:center;gap:8px;font-size:13px}
.drp-inp{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;width:120px;font-family:inherit}
/* Desktop — side-by-side layout */
@media(min-width:601px){
  .drp-modal-overlay{align-items:center}
  .drp-modal{border-radius:var(--radius-lg);max-height:90vh;flex-direction:row;width:95vw;max-width:700px}
  .drp-modal::before{display:none}
  .drp-sidebar{flex-direction:column;min-width:130px;border-right:1px solid var(--border);border-bottom:none;overflow-x:hidden;overflow-y:auto;padding:12px 0;background:#F8FAFC;gap:0}
  .drp-sidebar button{border-radius:0;border:none;background:none;padding:9px 16px;min-height:auto}
  .drp-sidebar button.drp-active{background:var(--primary-glow);color:var(--primary)}

/* ═══ WIZARD FORM UI — New Design ═══ */
.wiz-wrap{max-width:680px;margin:0 auto;padding-bottom:110px}
.wiz-section{background:#fff;border-radius:16px;border:1px solid #E8EDF2;padding:22px 22px 10px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.wiz-stitle{font-size:10px;font-weight:800;color:#94A3B8;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.wiz-stitle-bar{width:3px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0}

/* 3-col date/time row */
.wiz-dt-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:520px){.wiz-dt-row{grid-template-columns:1fr}}

.wiz-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.wiz-row2{grid-template-columns:1fr}}
.wiz-f{margin-bottom:16px}
.wiz-lbl{font-size:11px;font-weight:700;color:#64748B;margin-bottom:7px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.06em}
.wiz-lbl .req{color:var(--danger);font-size:14px;text-transform:none}
.wiz-lbl .lbl-icon{font-size:13px}
.wiz-inp,.wiz-sel,.wiz-ta{width:100%;padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;transition:all .15s;-webkit-appearance:none;appearance:none;box-sizing:border-box}
.wiz-inp[type="date"],.wiz-inp[type="time"]{font-size:15px;font-weight:500}
.wiz-inp:focus,.wiz-sel:focus,.wiz-ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.wiz-inp::placeholder,.wiz-ta::placeholder{color:#CBD5E1;font-weight:400}
.wiz-ta{resize:vertical;min-height:100px;line-height:1.7}
.wiz-hint{font-size:11px;color:#94A3B8;margin-top:5px;display:flex;align-items:center;gap:4px}

/* Job Type Cards — 5 columns */
.wiz-tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px}
@media(max-width:520px){.wiz-tgrid{grid-template-columns:repeat(3,1fr)}}
.wiz-tc{border:1.5px solid #E2E8F0;border-radius:12px;padding:14px 8px 12px;cursor:pointer;transition:all .15s;background:#FAFBFC;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;text-align:center;position:relative}
.wiz-tc:hover{border-color:var(--primary-light);background:#F0F7FF;transform:translateY(-1px)}
.wiz-tc.on{border-color:var(--primary);background:#fff;box-shadow:0 2px 8px rgba(37,99,235,.12)}
.wiz-tc .em{font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;width:32px;height:32px;color:#475569}
.wiz-tc .nm{font-size:10px;font-weight:600;line-height:1.4;color:#64748B}
.wiz-tc.on .nm{color:var(--primary-dark);font-weight:700}
.wiz-tc.on .em{color:var(--primary)}
/* Radio circle top-right */
.wiz-tc .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid #CBD5E1;position:absolute;top:8px;right:8px;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wiz-tc.on .ck{background:var(--primary);border-color:var(--primary)}
.wiz-tc.on .ck::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;display:block}

/* Department pills */
.wiz-dpills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.wiz-dp{padding:8px 18px;border-radius:20px;border:1.5px solid #E2E8F0;background:#fff;font-size:13px;font-weight:600;color:#64748B;cursor:pointer;transition:all .12s;user-select:none}
.wiz-dp:hover{border-color:var(--primary-light);color:var(--primary);background:#F0F7FF}
.wiz-dp.on{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow)}

/* Autocomplete */
.wiz-acw{position:relative}
.wiz-acl{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--primary);border-radius:12px;box-shadow:var(--shadow-lg);z-index:300;max-height:190px;overflow-y:auto;display:none}
.wiz-acl.open{display:block}
.wiz-aci{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px;transition:background .1s;border-bottom:1px solid #F8FAFC}
.wiz-aci:last-child{border-bottom:none}
.wiz-aci:hover{background:#F0F7FF}
.wiz-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.wiz-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* Urgent toggle — matches screenshot */
.wiz-urg{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid #E2E8F0;border-radius:12px;cursor:pointer;transition:all .15s;background:#fff;user-select:none}
.wiz-urg:hover{border-color:#CBD5E1}
.wiz-urg.on{border-color:#FCA5A5;background:#FFF5F5}
.wiz-urg .ui{font-size:22px;flex-shrink:0}
.wiz-urg .ut{flex:1}
.wiz-urg .utt{font-size:14px;font-weight:700;color:var(--text-strong)}
.wiz-urg .ust{font-size:11px;color:#94A3B8;margin-top:2px}
.wiz-tog{width:44px;height:24px;border-radius:12px;background:#E2E8F0;position:relative;transition:background .2s;flex-shrink:0}
.wiz-tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.20)}
.wiz-urg.on .wiz-tog{background:#EF4444}
.wiz-urg.on .wiz-tog::after{transform:translateX(20px)}

/* Bottom action bar */
.wiz-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.wiz-bari{max-width:680px;width:100%;display:flex;gap:10px}
.wiz-bcnl{padding:13px 24px;border-radius:12px;background:#F1F5F9;color:#64748B;font-size:14px;font-weight:600;border:1.5px solid #E2E8F0;font-family:inherit;cursor:pointer;flex-shrink:0;transition:all .12s}
.wiz-bcnl:hover{background:#E2E8F0;color:var(--text)}
.wiz-bsub{flex:1;padding:13px 24px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:15px;font-weight:700;border:none;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px var(--primary-glow);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.wiz-bsub:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px var(--primary-glow)}
.wiz-bsub:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* Keep chips for compatibility */
.wiz-chips{display:none}
.wiz-chip{display:none}
.wiz-trow{display:none}
.wiz-tsep{display:none}

/* ── MAP PAGE ── */
.map-page{display:flex;flex-direction:column;height:calc(100vh - 58px);padding:0;overflow:hidden}
.map-toolbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;z-index:10}

/* ── Executive Dashboard ─────────────────────── */
.exec-page-bg{background:transparent;padding:0}
/* ── Dashboard Hero Header ── */
.dash-hero{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 55%,#1D4ED8 100%);border-radius:20px;padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.dash-hero::before{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(99,102,241,.25),transparent 70%);pointer-events:none}
.dash-hero::after{content:'';position:absolute;left:-40px;bottom:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(59,130,246,.15),transparent 70%);pointer-events:none}
.dash-hero-left{}
.dash-hero-eyebrow{font-size:10px;font-weight:700;color:rgba(147,197,253,.8);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dash-hero-eyebrow::before{content:'';display:inline-block;width:18px;height:2px;background:rgba(147,197,253,.6);border-radius:1px}
.dash-hero-title{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.dash-hero-date{font-size:12px;color:rgba(147,197,253,.75);font-weight:500}
.dash-hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dash-hero-stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 18px;text-align:center;backdrop-filter:blur(8px);min-width:64px}
.dash-hero-stat-val{font-size:22px;font-weight:800;color:#fff;line-height:1;font-family:'Inter','Sarabun',sans-serif}
.dash-hero-stat-lbl{font-size:9px;font-weight:700;color:rgba(147,197,253,.7);letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.exec-date-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:all .18s;backdrop-filter:blur(8px)}
.exec-date-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
/* ── KPI Row 1 ── */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:12px}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:#fff;border-radius:16px;border:1px solid #EEF2F7;padding:18px 18px 0;position:relative;min-width:0;cursor:default;box-shadow:0 1px 4px rgba(15,23,42,.05);will-change:transform;transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;display:flex;flex-direction:column;overflow:hidden}
.kpi-card::after{content:'';position:absolute;inset:0;border-radius:16px;opacity:0;transition:opacity .18s;pointer-events:none;background:radial-gradient(circle at 60% 30%,rgba(255,255,255,.6),transparent 70%)}
.kpi-card[onclick]{cursor:pointer;outline:none!important;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-focus-ring-color:transparent}

.kpi-val{font-size:34px;font-weight:900;line-height:1;margin-bottom:3px;letter-spacing:-.03em;font-family:'Inter','Sarabun',sans-serif}

.hm-charts-row{display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:20px}
.hm-chart-card{background:#fff;border:1px solid #EEF2F7;border-radius:16px;

<script>
// ── DRP Engine ───────────────────────────────────────────────
var drpState = { s:'', e:'', vy:0, vm:0, cb:null, presetKey:'thismonth' };
(function(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  drpState.vy=y; drpState.vm=m;
  drpState.s=y+'-'+String(m+1).padStart(2,'0')+'-01';
  drpState.e=y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0');
})();

function drpFmt(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

function drpOpen(cb){
  drpState.cb=cb;
  document.getElementById('drpSI').value=drpState.s;
  document.getElementById('drpEI').value=drpState.e;
  drpRenderSidebar();
  drpRenderCals();
  document.getElementById('drpOverlay').classList.add('open');
}
function drpClose(){ document.getElementById('drpOverlay').classList.remove('open'); }
function drpApply(){
  var si=document.getElementById('drpSI').value, ei=document.getElementById('drpEI').value;
  if(si&&ei){ drpState.s=si<=ei?si:ei; drpState.e=si<=ei?ei:si; }
  drpClose();
  if(drpState.cb) drpState.cb(drpState.s, drpState.e);
}
function drpInputChange(){
  var si=document.getElementById('drpSI').value, ei=document.getElementById('drpEI').value;
  if(si){ drpState.s=si; drpState.e=ei||si;
    var d=new Date(si+'T00:00:00'); drpState.vy=d.getFullYear(); drpState.vm=d.getMonth();
    drpState.presetKey=''; drpRenderSidebar(); drpRenderCals(); }
}
function drpPreset(k){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  var s,e;
  if(k==='today'){s=e=drpFmt(now);}
  else if(k==='yesterday'){var q=new Date(now);q.setDate(d-1);s=e=drpFmt(q);}
  else if(k==='thisweek'){var q=new Date(now);q.setDate(d-now.getDay());var q2=new Date(q);q2.setDate(q.getDate()+6);s=drpFmt(q);e=drpFmt(q2);}
  else if(k==='lastweek'){var q=new Date(now);q.setDate(d-now.getDay()-7);var q2=new Date(q);q2.setDate(q.getDate()+6);s=drpFmt(q);e=drpFmt(q2);}
  else if(k==='thismonth'){s=y+'-'+String(m+1).padStart(2,'0')+'-01';e=y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0');}
  else if(k==='lastmonth'){var lm=m===0?11:m-1,ly=m===0?y-1:y;s=ly+'-'+String(lm+1).padStart(2,'0')+'-01';e=ly+'-'+String(lm+1).padStart(2,'0')+'-'+String(new Date(ly,lm+1,0).getDate()).padStart(2,'0');}
  else if(k==='2months'){var lm2=m<=1?m+10:m-2,ly2=m<=1?y-1:y;s=ly2+'-'+String(lm2+1).padStart(2,'0')+'-01';e=ly2+'-'+String(lm2+1).padStart(2,'0')+'-'+String(new Date(ly2,lm2+1,0).getDate()).padStart(2,'0');}
  drpState.s=s; drpState.e=e; drpState.presetKey=k;
  var sd=new Date(s+'T00:00:00'); drpState.vy=sd.getFullYear(); drpState.vm=sd.getMonth();
  document.getElementById('drpSI').value=s; document.getElementById('drpEI').value=e;
  drpRenderSidebar(); drpRenderCals();
}
function drpNav(delta){
  drpState.vm+=delta;
  if(drpState.vm>11){drpState.vm=0;drpState.vy++;}
  if(drpState.vm<0){drpState.vm=11;drpState.vy--;}
  drpRenderCals();
}
function drpRenderSidebar(){
  var presets=[['today','Today'],['yesterday','Yesterday'],['thisweek','This week'],['lastweek','Last week'],['thismonth','This month'],['lastmonth','Last month'],['2months','2 months ago']];
  document.getElementById('drpSidebar').innerHTML=presets.map(function(p){
    return '<button onclick="drpPreset(\''+p[0]+'\')" class="'+(drpState.presetKey===p[0]?'drp-active':'')+'">'+p[1]+'</button>';
  }).join('');
}
function drpRenderCals(){
  var vy=drpState.vy, vm=drpState.vm;
  var ny=vm===11?vy+1:vy, nm=vm===11?0:vm+1;
  var isMobile = window.innerWidth <= 600;
  document.getElementById('drpCals').innerHTML = isMobile
    ? drpCal(vy,vm,true)
    : drpCal(vy,vm,true)+drpCal(ny,nm,false);
}
function drpCal(y,m,isL){
  var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dn=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var first=new Date(y,m,1).getDay(), tot=new Date(y,m+1,0).getDate();
  var now=new Date(), ts=drpFmt(now);
  var h='<div class="drp-cal"><div class="drp-cal-head">';
  h+=(isL?'<button type="button" onclick="drpNav(-1)">‹</button>':'<span></span>');
  h+='<span>'+mn[m]+' '+y+'</span>';
  h+=(!isL?'<button type="button" onclick="drpNav(1)">›</button>':'<span></span>');
  h+='</div><div class="drp-grid">';
  dn.forEach(function(n){h+='<div class="drp-dn">'+n+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="drp-d drp-dim"></div>';
  for(var dd=1;dd<=tot;dd++){
    var ymd=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    var cls='drp-d';
    if(ymd===ts)cls+=' drp-tod';
    if(drpState.s&&drpState.e&&ymd>drpState.s&&ymd<drpState.e)cls+=' drp-inr';
    if(drpState.s&&ymd===drpState.s)cls+=' drp-rs';
    if(drpState.e&&ymd===drpState.e)cls+=' drp-re';
    h+='<div class="'+cls+'" onclick="drpDay(\''+ymd+'\')">'+dd+'</div>';
  }
  return h+'</div></div>';
}
function drpDay(ymd){
  if(!drpState.s||(drpState.s&&drpState.e)||ymd<drpState.s){
    drpState.s=ymd; drpState.e='';
    document.getElementById('drpSI').value=ymd; document.getElementById('drpEI').value='';
  } else {
    drpState.e=ymd; document.getElementById('drpEI').value=ymd;
  }
  drpState.presetKey=''; drpRenderSidebar(); drpRenderCals();
}
function drpLabel(){ return drpState.s&&drpState.e ? drpState.s+' — '+drpState.e : 'เลือกช่วงวันที่'; }

// ── API ──────────────────────────────────────────────────────
const State = {
  page: 'home', users: [], departments: [], settings: {},
  jobs: [], calendarMonth: new Date(),
  adminToken: localStorage.getItem('adminToken') || '',
  adminUser:  localStorage.getItem('adminUser')  || ''
};
// Apps Script Web App (API backend) — ใช้เมื่อหน้าเว็บเปิดจาก GitHub Pages
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxh5PVMG7TMpknhPE4XB7AS5M542e_KR8Os8Gjxe_198WtM5VQInny1wQ7RZUb4Rg08/exec';
function api(action, params) {
  params = params || {};
  return new Promise(function(resolve) {
    var data = Object.assign({}, params, { action: action });
    Object.keys(data).forEach(function(k) {
      if (Array.isArray(data[k]) || (typeof data[k] === 'object' && data[k] !== null)) {
        data[k] = JSON.stringify(data[k]);
      }
    });
    var _done = false;
    // เปิดจาก GitHub Pages (ไม่มี google.script.run) → เรียก Apps Script ผ่าน fetch POST (form-urlencoded = ไม่มี CORS preflight)
    if (!(window.google && google.script && google.script.run)) {
      var _t = setTimeout(function() {
        if (!_done) { _done = true; resolve({ ok: false, error: 'timeout:'+action }); }
      }, 25000);
      fetch(GAS_URL, { method: 'POST', body: new URLSearchParams(data) })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (!_done) { _done = true; clearTimeout(_t); resolve(result || { ok: false, error: 'No response' }); }
        })
        .catch(function(err) {
          if (!_done) { _done = true; clearTimeout(_t); resolve({ ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่' }); }
        });
      return;
    }
    var _timer = setTimeout(function() {
      if (!_done) { _done = true; resolve({ ok: false, error: 'timeout:'+action }); }
    }, 12000);
    google.script.run
      .withSuccessHandler(function(result) {
        if (!_done) { _done = true; clearTimeout(_timer); resolve(result || { ok: false, error: 'No response' }); }
      })
      .withFailureHandler(function(err) {
        if (!_done) { _done = true; clearTimeout(_timer); resolve({ ok: false, error: err.message || String(err) }); }
      })
      .routeApiFromClient(data);
  });
}
function toast(msg, type) {
  type = type || 'success';
  var el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : type === 'warning' ? ' warning' : '');
  var icon = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '✅';
  el.innerHTML = '<span>' + icon + '</span><span>' + escapeHtml(msg) + '</span>';
  document.body.appendChild(el);
  setTimeout(function() { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},300); }, 4000);
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
}
function fmtDateTH(ymd) {
  if (!ymd) return '';
  var p = ymd.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function todayYMD() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function thisMonth() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function getInitials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
function greetByHour() {
  var h = new Date().getHours();
  if (h < 12) return 'สวัสดีตอนเช้า';
  if (h < 17) return 'สวัสดีตอนบ่าย';
  return 'สวัสดีตอนเย็น';
}
function showApiError(msg) {
  return '<div class="api-error-banner"><span class="icon">🔴</span><div>' +
    '<strong>เชื่อมต่อ API ไม่ได้</strong><br>' +
    '<span style="font-size:12px;white-space:pre-line">' + escapeHtml(msg) + '</span><br><br>' +
    '<strong style="font-size:12px">วิธีแก้:</strong>' +
    '<ol style="font-size:12px;margin-left:16px;margin-top:4px;line-height:1.8">' +
    '<li>Apps Script → Deploy → <strong>New deployment</strong></li>' +
    '<li>Execute as: <strong>Me</strong></li>' +
    '<li>Who has access: <strong>Anyone</strong></li>' +
    '<li>คัดลอก URL ใหม่มาใช้</li></ol></div></div>';
}
// ── Cache Layer ──────────────────────────────────────────────
var _cache={},_cacheExpiry={};
var CACHE_TTL=60000;
function cacheGet(k){if(_cache[k]&&Date.now()<(_cacheExpiry[k]||0))return _cache[k];return null;}
function cacheSet(k,v,ttl){_cache[k]=v;_cacheExpiry[k]=Date.now()+(ttl||CACHE_TTL);}
function cacheClear(k){delete _cache[k];delete _cacheExpiry[k];}
function cacheClearAll(){_cache={};_cacheExpiry={};}
async function apiCached(action,params,ttl){
  var k=action+JSON.stringify(params||{});
  var hit=cacheGet(k);if(hit)return hit;
  var r=await api(action,params);
  if(r.ok)cacheSet(k,r,ttl);
  return r;
}
function navigate(page) {
  if(page !== 'home'){ _homeStatusFilter = ''; }
  State.page = page;
  document.querySelectorAll('[data-page]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.page === page);
  });
  var root = document.getElementById('page');
  root.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  switch(page) {
    case 'home':     return renderHome();
    case 'add':      return renderAdd();
    case 'calendar': return renderCalendar();
    case 'list':     return renderList();
    case 'admin':    return renderAdmin();
    case 'map':      return renderMap();
    case 'faq':      return renderFAQ();
  }
}
async function init() {
  // Wire up navigation via event delegation (avoids inline handler CSP issues)
  var _nd = function(el) {
    if (!el) return;
    el.addEventListener('click', function(ev) {
      var b = ev.target;
      while (b && b !== el) { if (b.dataset && b.dataset.page) { navigate(b.dataset.page); return; } b = b.parentElement; }
    });
  };
  _nd(document.getElementById('navTabs'));
  _nd(document.getElementById('bottomNav'));
  var njb = document.getElementById('btnNewJob');
  if (njb) njb.onclick = function() { navigate('add'); };
  document.getElementById('page').innerHTML='<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>';
  try {
    // Parallel fetch — ลดเวลาจาก 3x เป็น 1x round-trip
    var results = await Promise.all([
      api('getSettings'),
      api('getUsers'),
      api('getDepartments'),
      api('getJobs', { month: thisMonth() })   // pre-warm home page cache
    ]);
    var s=results[0], u=results[1], d=results[2], j=results[3];
    if(s&&s.ok){ State.settings=s.data; applyTheme(s.data); cacheSet('getSettings{}',s); }
    if(u&&u.ok){ State.users=u.data;    cacheSet('getUsers{}',u); }
    if(d&&d.ok){ State.departments=d.data; cacheSet('getDepartments{}',d); }
    if(j&&j.ok){ cacheSet('getJobs'+JSON.stringify({month:thisMonth()}),j,30000); }
  } catch(e) { console.error('init:',e); }
  navigate('home');
}
function normalizeLogoUrl(url) {
  if (!url) return '';
  // Extract Google Drive file ID from various URL formats
  var fileId = null;
  var m;
  // lh3.googleusercontent.com/d/FILE_ID
  m = url.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
  if (m) fileId = m[1];
  // drive.google.com/file/d/FILE_ID
  if (!fileId) { m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/); if (m) fileId = m[1]; }
  // drive.google.com/open?id= or uc?id=
  if (!fileId) { m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/); if (m) fileId = m[1]; }

  if (fileId) {
    // Use thumbnail endpoint — works cross-origin without auth, no redirect
    return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w200';
  }
  return url;
}
function applyTheme(s) {
  if (s.themeColor) {
    document.documentElement.style.setProperty('--primary', s.themeColor);
    document.documentElement.style.setProperty('--primary-light', shadeColor(s.themeColor, 15));
    document.documentElement.style.setProperty('--primary-dark', shadeColor(s.themeColor, -15));
  }
  if (s.companyName) document.getElementById('brandName').textContent = s.companyName;
  if (s.systemName !== undefined) {
    var sub = document.getElementById('brandSub');
    if (sub) sub.textContent = s.systemName || 'Messenger System';
  }
  if (s.logoUrl) {
    var img = document.getElementById('logoImg');
    var fallback = document.getElementById('logoFallback');
    var normUrl = normalizeLogoUrl(s.logoUrl);
    img.removeAttribute('crossorigin');
    img.onload = function() {
      img.style.display = 'block';
      if (fallback) fallback.style.display = 'none';
      State._logoUrl = normUrl;
    };
    img.onerror = function() {
      img.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
    };
    img.src = normUrl;
  }
}
function shadeColor(color, percent) {
  const n = parseInt(color.replace('#',''), 16);
  let r = (n>>16) + Math.round(2.55*percent);
  let g = ((n>>8)&0xff) + Math.round(2.55*percent);
  let b = (n&0xff) + Math.round(2.55*percent);
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
// ── PAGE: HOME ───────────────────────────────────────────────
var _homeFilter = { s:'', e:'' };
var _homeStatusFilter = ''; // '', 'all', 'done', 'pending', 'today'
var _homeLastUpdated = 0;   // timestamp of last successful fetch

async function renderHome() {
  const month = thisMonth();
  const today = todayYMD();
  if(!_homeFilter.s) _homeFilter.s = today;
  if(!_homeFilter.e) _homeFilter.e = today;

  // Show from cache instantly if available
  const cached = cacheGet('getJobs'+JSON.stringify({month}));
  if(cached && cached.ok){
    if(!_homeLastUpdated) _homeLastUpdated = Date.now();
    _renderHomePage(cached.data);
    return;
  }

  // No cache — show skeleton then fetch
  document.getElementById('page').innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>';
  const r = await api('getJobs', { month });
  if(!r.ok){ document.getElementById('page').innerHTML = `<div class="page">${showApiError(r.error)}</div>`; return; }

async function _getHomeJobs(){
  const month = thisMonth();
  const key = 'getJobs'+JSON.stringify({month});
  const cached = cacheGet(key);
  if(cached && cached.ok) return cached.data;
  // Cache missing/expired — fetch fresh instead of silently failing
  const r = await api('getJobs', { month });
  if(!r.ok) return null;
  cacheSet(key, r, 30000);
  _homeLastUpdated = Date.now();
  return r.data;
}

function homeDrpOpen(){
  drpOpen(async function(s,e){
    _homeFilter.s=s; _homeFilter.e=e;
    _homeStatusFilter='';
    const jobs=await _getHomeJobs();
    if(jobs) _renderHomePage(jobs);
  });
  if(_homeFilter.s){ drpState.s=_homeFilter.s; drpState.e=_homeFilter.e; drpRenderSidebar(); drpRenderCals(); }
}

async function homeToggleStatus(type){
  _homeStatusFilter = (_homeStatusFilter===type) ? '' : type;
  const jobs=await _getHomeJobs();
  if(jobs){
    _renderHomePage(jobs);
    setTimeout(()=>{
      const sec=document.getElementById('today-jobs-section');
      if(sec){
        const top=sec.getBoundingClientRect().top+window.pageYOffset-72;
        window.scrollTo({top,behavior:'smooth'});
        const list=document.getElementById('today-jobs-list');
        if(list){list.classList.remove('jobs-flash');void list.offsetWidth;list.classList.add('jobs-flash');setTimeout(()=>list.classList.remove('jobs-flash'),900);}
      }
    },80);
  }
}

function drawLineChart(labels, data, days){
  const cv = document.getElementById('lineChart');
  if(!cv || !window.Chart) return;
  if(cv._chartInst) cv._chartInst.destroy();
  const today = todayYMD();
  const pointColors = days.map(d => d===today ? '#EF4444' : '#2563EB');
  const pointRadius = days.map(d => d===today ? 6 : 4);
  cv._chartInst = new Chart(cv, {
    type:'line',
    data:{
      labels: labels,
      datasets:[{
        label:'งาน',
        data: data,
        borderColor:'#2563EB',
        backgroundColor:'rgba(37,99,235,.08)',
        borderWidth:2.5,
        pointBackgroundColor: pointColors,
        pointRadius: pointRadius,
        pointHoverRadius:7,
        tension:.35,
        fill:true
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0F172A',
          titleColor:'#94A3B8',
          bodyColor:'#fff',
          padding:10,
          cornerRadius:8,
          callbacks:{
            title:function(items){ return 'วันที่ '+items[0].label; },
            label:function(item){ return ' งาน '+item.raw+' รายการ'; }
          }
        }
      },
      scales:{
        x:{grid:{color:'rgba(226,232,240,.5)'},ticks:{font:{size:10},color:'#94A3B8',maxRotation:0}},
        y:{grid:{color:'rgba(226,232,240,.5)'},ticks:{font:{size:10},color:'#94A3B8',stepSize:1,precision:0},beginAtZero:true}
      },
      onClick:function(e,els){
        if(!els.length)return;
        const idx=els[0].index;
        if(days[idx]){
          _homeFilter.s=days[idx]; _homeFilter.e=days[idx];
          const rc=_cache['getJobs'+JSON.stringify({month:thisMonth()})];
          if(rc&&rc.ok) _renderHomePage(rc.data);
        }
      }
    }
  });
}

function drawDonutChart(done, pending, newCount, urgent, cancelled){
  cancelled = cancelled || 0;
  const cv = document.getElementById('donutChart');
  if(!cv || !window.Chart) return;
  if(cv._chartInst) cv._chartInst.destroy();
  const total = done+pending+newCount+cancelled;
  if(!total){ cv.getContext('2d').clearRect(0,0,cv.width,cv.height); return; }
  cv._chartInst = new Chart(cv, {
    type:'doughnut',
    data:{
      labels:['เสร็จแล้ว','รอดำเนินการ','ใหม่','ยกเลิก'],
      datasets:[{
        data:[done,pending,newCount,cancelled],
        backgroundColor:['#10B981','#F59E0B','#3B82F6','#DC2626'],
        borderWidth:0,
        hoverOffset:4
      }]
    },
    options:{
      responsive:false,
      cutout:'68%',
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0F172A',
          bodyColor:'#fff',
          padding:8,
          cornerRadius:8
        }
      }
    }
  });
}

function highlightJobSection(){
  // Scroll to section
  var sec = document.getElementById('today-jobs-section');
  var list = document.getElementById('today-jobs-list');
  if(!sec) return;
  // Try smooth scroll on window
  var top = sec.getBoundingClientRect().top + window.pageYOffset - 80;
  window.scrollTo({top: top, behavior: 'smooth'});
  // Flash highlight on job list
  if(list){
    list.classList.remove('jobs-flash');
    void list.offsetWidth; // reflow
    list.classList.add('jobs-flash');
    setTimeout(function(){ list.classList.remove('jobs-flash'); }, 1200);
  }
  // Also flash the section head
  sec.classList.remove('section-flash');
  void sec.offsetWidth;
  sec.classList.add('section-flash');
  setTimeout(function(){ sec.classList.remove('section-flash'); }, 1200);
}
function toggleJobCard(rowNum){
  const card=document.getElementById('jcard-'+rowNum);
  if(!card)return;
  const isOpen=card.classList.contains('open');
  document.querySelectorAll('.job-card.open').forEach(c=>{if(c!==card){c.classList.remove('open');}});
  card.classList.toggle('open',!isOpen);
}

function wUF(q){
  var ul=document.getElementById('wUL');
  if(!ul) return;
  var lq=(q||'').trim().toLowerCase();

  // ใช้เฉพาะ users จาก Sheet — ไม่อนุญาตเพิ่มชื่อใหม่เอง
  var list = State.users.filter(function(u){
    var name = typeof u==='object' ? (u.displayName||u.username||'') : String(u);
    var username = typeof u==='object' ? (u.username||'') : String(u);
    // ค้นหาจากทั้ง displayName และ username
    return !lq || name.toLowerCase().indexOf(lq)>=0 || username.toLowerCase().indexOf(lq)>=0;
  });

  if(!list.length){
    ul.innerHTML = '<div style="padding:14px 16px;font-size:12px;color:#94A3B8;text-align:center">'+(lq?'ไม่พบชื่อ "'+escapeHtml(q)+'"':'ไม่มีข้อมูลผู้ใช้')+'</div>';
    ul.classList.add('open');
    return;
  }
  if(!lq && !document.getElementById('wUs').matches(':focus')){ ul.classList.remove('open'); return; }

  ul.classList.add('open');
  ul.innerHTML = list.slice(0,10).map(function(u){
    var username = typeof u==='object' ? (u.username||'') : String(u);
    // ชื่อแสดง: ใช้ displayName > firstName+lastName > username
    var firstName = typeof u==='object'?(u.firstName||''):'';
    var lastName  = typeof u==='object'?(u.lastName||''):'';
    var fullName  = (firstName+' '+lastName).trim();
    var displayName = typeof u==='object'?(u.displayName||''):'';
    var showName  = displayName || fullName || username;
    var dept      = typeof u==='object'?(u.dept||''):'';
    var avatarUrl = typeof u==='object'?(u.avatarUrl||''):'';
    var initials  = getInitials(showName);
    // Avatar: รูปจริงถ้ามี ไม่งั้นใช้ตัวอักษรย่อ
    var avatarHtml = avatarUrl
      ? '<div class="wiz-av"><img src="'+escapeHtml(avatarUrl)+'" alt="'+escapeHtml(showName)+'"></div>'
      : '<div class="wiz-av">'+escapeHtml(initials)+'</div>';
    return '<div class="wiz-aci" data-un="'+escapeHtml(username).replace(/"/g,'&quot;')+'" data-sn="'+escapeHtml(showName).replace(/"/g,'&quot;')+'" onmousedown="wPUFromEl(this)">'+
      avatarHtml+
      '<div style="min-width:0;flex:1">'+
        '<div style="font-weight:700;font-size:13px;color:#0F172A">'+escapeHtml(showName)+'</div>'+
        (dept?'<div style="font-size:11px;color:#94A3B8;margin-top:1px">'+escapeHtml(dept)+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function wImgPreview(input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    // Resize to max 1200px and compress to keep payload small
    var img = new Image();
    img.onload = function() {
      var MAX = 1200;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) { var r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var b64 = cv.toDataURL('image/jpeg', 0.82);
      _W.imageBase64 = b64;
      document.getElementById('wImgThumb').src = b64;
      document.getElementById('wImgPreview').style.display = 'block';
      document.getElementById('wImgLabel').style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

async function renderCalendar() {
  const cm = State.calendarMonth;
  const ymStr = cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0');
  const cal = await apiCached('getCalendar', { month: ymStr }, 30000);
  const data = cal.ok ? cal.data : {};
  const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dayNames=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const firstDay=new Date(cm.getFullYear(),cm.getMonth(),1).getDay();
  const daysInMonth=new Date(cm.getFullYear(),cm.getMonth()+1,0).getDate();
  const today=todayYMD();
  let cells='';
  for(let i=0;i<firstDay;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ymd=cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const info=data[ymd]||{count:0,urgent:0,done:0,depts:[]};
    const isToday=ymd===today;
    const hasJobs=info.count>0;

    // Build event chips (show up to 2 on desktop)
    let chipsHtml='';
    if(hasJobs){
      const shown=info.depts.slice(0,2);
      shown.forEach(dep=>{
        // determine chip color: if done > 0 and no urgent, use done; if urgent use urgent; else normal
        const cls = info.urgent>0 ? 'chip-urgent' : info.done>0 && info.done===info.count ? 'chip-done' : 'chip-normal';
        chipsHtml+=`<div class="cal-event-chip ${cls}">${escapeHtml(dep)}</div>`;
      });
      const remaining=info.count-shown.length;
      if(remaining>0) chipsHtml+=`<div class="cal-event-more">+${remaining} เพิ่มเติม</div>`;
      // mobile fallback dots
      chipsHtml+=`<div class="cal-dots" style="display:none">
        ${info.urgent>0?`<span class="cal-dot urgent"></span>`:''}
        ${info.done>0?`<span class="cal-dot done"></span>`:''}
        ${info.count-info.urgent-info.done>0?`<span class="cal-dot"></span>`:''}
      </div>`;
    }

    cells+=`<div class="cal-cell ${isToday?'today':''} ${hasJobs?'has-jobs':''}" onclick="showDayJobs('${ymd}')">
      <div class="cal-date-wrap">
        <div class="cal-date">${d}</div>
        ${isToday?'':''}
      </div>
      <div class="cal-events">${chipsHtml}</div>
    </div>`;
  }
  document.getElementById('page').innerHTML=`
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" style="display:flex;align-items:center;gap:10px">
          <span style="width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px var(--primary-glow)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
          ปฏิทินงาน
        </h1>
        <p class="page-subtitle">คลิกที่วันเพื่อดูงานทั้งหมดในวันนั้น</p>
      </div>
      ${!cal.ok?showApiError(cal.error):''}
      <div class="calendar">
        <div class="cal-header">
          <div class="cal-title">${monthNames[cm.getMonth()]} ${cm.getFullYear()}</div>
          <div class="cal-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button class="btn-today" onclick="goToday()">Today</button>
            <button onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-grid">${dayNames.map(n=>`<div class="cal-day-name">${n}</div>`).join('')}${cells}</div>
        <div class="cal-legend">
          <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--primary)"></span> ปกติ</span>
          <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--danger)"></span> เร่งด่วน</span>
          <span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--success)"></span> เสร็จแล้ว</span>
        </div>
      </div>
    </div>`;
}
